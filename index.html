<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boundless Client Loader</title>
    <style>
        body { 
            background: #121212; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        .container { text-align: center; max-width: 500px; padding: 20px; }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            border-left-color: #d455ff; 
            animation: spin 0.8s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin: 0 0 10px; font-weight: 400; letter-spacing: 1px; color: #fff; }
        p { color: #888; margin: 0; font-size: 14px; }
        .version-badge {
            display: inline-block;
            background: #222;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            color: #d455ff;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        #error-msg { color: #ff5555; display: none; margin-top: 20px; font-weight: bold; font-family: monospace; font-size: 13px; background: #201111; padding: 10px; border-radius: 6px; border: 1px solid #402222; }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner" id="loader"></div>
        <div class="version-badge" id="badge">Detecting Variant Path...</div>
        <h2 id="status">Scanning Release Directory...</h2>
        <p id="sub-status">Configuring secure browser origin mapping</p>
        <div id="error-msg"></div>
    </div>

    <script>
        const username = "TerryYang80";
        const repoName = "TerryThe67Rizzler";
        
        // Extract the path typed in the URL
        const pathSegments = window.location.pathname.split('/').filter(seg => seg && seg !== repoName);
        
        let versionTag = "V1";
        let fileName = "BOUNDLESS_V1.0.1.html";

        if (pathSegments.length > 0) {
            versionTag = pathSegments[0]; // Keeps original casing matching your release tag
            
            if (versionTag.toUpperCase() === "V1") {
                fileName = "BOUNDLESS_V1.0.1.html";
            } else {
                fileName = `BOUNDLESS_${versionTag}.html`;
            }
        }

        // CORRECTION: Target the official Release Asset Download server link format directly
        const targetUrl = `https://cors-anywhere.herokuapp.com/https://github.com/${username}/${repoName}/releases/download/${versionTag}/${fileName}`;
        // ALTERNATIVE (If cors-anywhere is busy, use the open proxy endpoint):
        // const targetUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://github.com/${username}/${repoName}/releases/download/${versionTag}/${fileName}`)}`;

        document.getElementById('badge').innerText = `Target: ${versionTag}`;
        document.getElementById('status').innerText = `Loading Client Content`;
        document.getElementById('sub-status').innerText = `Streaming ${fileName} from release storage...`;

        fetch(targetUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Could not find the attached file [${fileName}] inside Release [${versionTag}].\nMake sure spelling and asset uploads match perfectly.`);
                }
                return response.text();
            })
            .then(htmlContent => {
                document.getElementById('sub-status').innerText = "Launching sandboxed client application layer...";
                
                document.open();
                document.write(htmlContent);
                document.close();
            })
            .catch(err => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('badge').style.background = '#401111';
                document.getElementById('badge').style.color = '#ff5555';
                document.getElementById('status').innerText = "Initialization Failed";
                
                const errDiv = document.getElementById('error-msg');
                errDiv.innerText = err.message;
                errDiv.style.display = 'block';
            });
    </script>
</body>
</html>
