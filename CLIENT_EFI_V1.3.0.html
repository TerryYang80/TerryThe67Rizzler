<script type="text/javascript"> 
"use strict"; 

var assetsReady = false; 

// Fixed internal database builder
function getDB() { 
    return new Promise((resolve, reject) => { 
        const request = indexedDB.open("EaglercraftX_Packs_Cache", 1); 
        request.onupgradeneeded = (e) => { 
            const db = e.target.result; 
            if (!db.objectStoreNames.contains("packs")) { 
                db.createObjectStore("packs", { keyPath: "name" }); 
            } 
        }; 
        request.onsuccess = (e) => resolve(e.target.result); 
        request.onerror = (e) => reject(e.target.error); 
    }); 
} 

(async function prepareGameData() { 
    // 1. STITCH ASSETS 
    const assetParts = [ 
        "https://raw.githubusercontent.com/TerryYang80/TerryThe67Rizzler/main/Assets/assetsV300.epk.part_aa", 
        "https://raw.githubusercontent.com/TerryYang80/TerryThe67Rizzler/main/Assets/assetsV300.epk.part_ab", 
        "https://raw.githubusercontent.com/TerryYang80/TerryThe67Rizzler/main/Assets/assetsV300.epk.part_ac" 
    ]; 
    
    try { 
        console.log("Downloading custom textures..."); 
        const assetBuffers = await Promise.all(assetParts.map(url => fetch(url).then(res => { 
            if (!res.ok) throw new Error("Asset chunk missing"); 
            return res.arrayBuffer(); 
        }))); 
        const combinedBlob = new Blob(assetBuffers, { type: "application/octet-stream" }); 
        window.eaglercraftXOpts.assetsURI = URL.createObjectURL(combinedBlob); 
        console.log("Assets stitched successfully.");
    } catch (err) { 
        console.error("Asset fallback triggered:", err); 
        window.eaglercraftXOpts.assetsURI = "https://web.arch.mc/assetsV300.epk"; 
    } 

    // 2. RESOURCE PACK STORAGE OVERRIDE
    try { 
        const db = await getDB(); 
        
        window.eaglercraftXOpts.resourcePacks = await Promise.all(window.eaglercraftXOpts.resourcePacks.map(async (pack) => { 
            return new Promise((resolve) => { 
                const tx = db.transaction("packs", "readonly"); 
                const store = tx.objectStore("packs"); 
                const getReq = store.get(pack.name); 
                
                getReq.onsuccess = async (e) => { 
                    const cached = e.target.result; 
                    if (cached) { 
                        console.log(`Loaded from local application cache: ${pack.name}`); 
                        pack.url = URL.createObjectURL(cached.blob); 
                        resolve(pack); 
                    } else { 
                        console.log(`First-time cache download for: ${pack.name}`); 
                        try {
                            const res = await fetch(pack.url); 
                            if (res.ok) { 
                                const blob = await res.blob(); 
                                const putTx = db.transaction("packs", "readwrite"); 
                                putTx.objectStore("packs").put({ name: pack.name, blob: blob }); 
                                pack.url = URL.createObjectURL(blob); 
                            } 
                        } catch(err) {
                            console.error(`Failed loading ${pack.name} from web, leaving defaults.`);
                        }
                        resolve(pack); 
                    } 
                }; 
                getReq.onerror = () => resolve(pack);
            }); 
        })); 
        console.log("All resource packs verified!");
    } catch (dbErr) { 
        console.error("Local database cache indexing failed", dbErr); 
    } 

    assetsReady = true; 
})(); 

// YOUR EXACT ORIGINAL TIME CODE
const countNumb = 1000; 
(function(){ 
    var launchInterval = -1; 
    var launchCounter = 1; 
    var launchCountdownNumberElement = null; 
    var launchCountdownProgressElement = null; 
    var launchSkipCountdown = false; 
    var launchTick = function() { 
        launchCountdownNumberElement.innerText = "" + Math.floor(1000.0 - launchCounter * 0.06); 
        launchCountdownProgressElement.style.width = "" + launchCounter + "%"; 
        if(++launchCounter > countNumb || launchSkipCountdown) { 
            if (!assetsReady) { 
                launchCounter--; 
                return; 
            } 
            clearInterval(launchInterval); 
            setTimeout(function() { 
                var screen = document.getElementById("launch_countdown_screen"); 
                if (screen) { 
                    document.body.removeChild(screen); 
                } 
                document.body.style.backgroundColor = "black"; 
                if (typeof main === "function") main(); 
            }, countNumb); 
        } 
    }; 
    window.addEventListener("load", function() { 
        launchCountdownNumberElement = document.getElementById("launchCountdownNumber"); 
        launchCountdownProgressElement = document.getElementById("launchCountdownProgress"); 
        launchInterval = setInterval(launchTick, countNumb); 
        document.getElementById("bootMenu").addEventListener("click", function() { 
            launchSkipCountdown = true; 
            if (!window.eaglercraftXOpts) window.eaglercraftXOpts = {}; 
            window.eaglercraftXOpts.showBootMenuOnLaunch = true; 
        }); 
        var classroomBtn = document.getElementById("ClassroomX"); 
        if (classroomBtn) { 
            classroomBtn.addEventListener("click", function() { 
                launchSkipCountdown = true; 
                document.title = "Home - Classroom"; 
                var link = document.querySelector("link[rel*='icon']") || document.createElement('link'); 
                link.type = 'image/x-icon'; 
                link.rel = 'shortcut icon'; 
                link.href = 'https://raw.githubusercontent.com/TerryYang80/TerryThe67Rizzler/main/192px.svg'; 
                document.getElementsByTagName('head')[0].appendChild(link); 
                alert("Google Classroom X Injected"); 
            }); 
        }; 
        var driveBtn = document.getElementById("DriveX"); 
        if (driveBtn) { 
            driveBtn.addEventListener("click", function() { 
                launchSkipCountdown = true; 
                document.title = "Recent - Google Drive"; 
                var link = document.querySelector("link[rel*='icon']") || document.createElement('link'); 
                link.type = 'image/x-icon'; 
                link.rel = 'shortcut icon'; 
                link.href = 'https://raw.githubusercontent.com/TerryYang80/TerryThe67Rizzler/main/DriveFavicon.png'; 
                document.getElementsByTagName('head')[0].appendChild(link); 
                alert("Google Drive X Injected"); 
            }); 
        } 
    }); 
})();
